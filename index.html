    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --card: #1a212b;
        --text: #eef2f6;
        --muted: #a8b3c0;
        --border: #2e3947;
        --accent: #7fb0dd;
        --accent-hover: #a5c8e8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px 32px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .tagline {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1rem;
    }
    .badge { margin: 0 0 20px; }
    .badge a { display: inline-block; line-height: 0; }
    .badge img { max-width: 100%; height: auto; }
    .status-note {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .actions { margin: 0 0 28px; }
    .button {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .button:hover { background: var(--accent-hover); }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      color: var(--muted);
      font-size: 0.875rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      main { padding: 32px 20px 24px; }
      h1 { font-size: 1.5rem; }
    }
